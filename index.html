const container = document.getElementById("video-container");
const dropdown = document.getElementById("taskDropdown");

function renderVideos(selectedTask = "All") {
  container.innerHTML = "";

  const filteredFiles =
    selectedTask === "All"
      ? videoFiles
      : videoFiles.filter(file => videoDescriptions[file] === selectedTask);

  filteredFiles.forEach(file => {
    const block = document.createElement("div");
    block.className = "video-block";

    const desc = document.createElement("p");
    desc.className = "description";
    desc.textContent = "Goal: " + (videoDescriptions[file] || "No description available.");

    const video = document.createElement("video");
    video.setAttribute("controls", "");
    video.setAttribute("controlslist", "");
    video.disablePictureInPicture = true;

    const source = document.createElement("source");
    source.src = "videos2/" + file;
    source.type = "video/mp4";

    video.appendChild(source);
    block.appendChild(desc);
    block.appendChild(video);
    container.appendChild(block);
  });
}

dropdown.addEventListener("change", function () {
  renderVideos(this.value);
});
