<script>
const videoDescriptions = {
  'q3vl8b_1129b_sftv2_lr1e5_eb48_85000_v2_pt3b_mscube_switchview_interp10_20260112_194227_concatenated.mp4':
    'Pick up the cube from the table.'
};

const videoFiles = [
  'q3vl8b_1129b_sftv2_lr1e5_eb48_85000_v2_pt3b_mscube_switchview_interp10_20260112_194227_concatenated.mp4'
];

const container = document.getElementById("video-container");

videoFiles.forEach(file => {
  const block = document.createElement("div");
  block.className = "video-block";

  const desc = document.createElement("p");
  desc.className = "description";
  desc.textContent = videoDescriptions[file] || "No description available.";
  desc.textContent = "Goal: " + desc.textContent

  const video = document.createElement("video");
  video.controls = true;

  const source = document.createElement("source");
  source.src = "videos/"+file;
  source.type = "video/mp4";

  video.appendChild(source);

  block.appendChild(desc);
  block.appendChild(video);
  container.appendChild(block);
});
</script>
